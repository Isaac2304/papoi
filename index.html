<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://gstatic.com"></script><script src="https://gstatic.com"></script><style>body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;background:#121212;color:white;margin:0;padding:20px}.container{text-align:center;background:#1e1e1e;padding:30px;border-radius:15px;border:2px solid #333;width:300px;margin-bottom:20px}button{padding:15px 30px;font-size:18px;font-weight:bold;background:#ffcb05;color:#111;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase;width:100%;margin-bottom:20px;transition:background .2s}button:hover{background:#ff9900}button:disabled{background:#555;color:#888;cursor:not-allowed}.box-resultado{min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-top:1px solid #333;padding-top:15px;margin-bottom:15px}.badge{font-size:11px;font-weight:bold;text-transform:uppercase;padding:4px 8px;border-radius:4px;margin-bottom:8px;display:inline-block}.nome-txt{font-size:18px;font-weight:bold;color:#fff}.painel-status{background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:12px;margin-top:15px;font-size:14px;text-align:left}.painel-status p{margin:6px 0}.destaque{color:#ffcb05;font-weight:bold}input[type="text"]{width:90%;padding:8px;margin-bottom:15px;border-radius:4px;border:1px solid #444;background:#2b2b2b;color:white;text-align:center}.ranking-global{margin-top:15px;border-top:1px solid #333;padding-top:15px}.ranking-lista{list-style:none;padding:0;margin:10px 0 0 0;text-align:left}.ranking-item{display:flex;justify-content:space-between;padding:6px;background:#252525;margin-bottom:4px;border-radius:4px;font-size:13px}.comum{background:#7f8c8d;color:white}.incomum{background:#2ecc71;color:#000}.raro{background:#2980b9;color:white}.epico{background:#9b59b6;color:white}.mitico{background:#e74c3c;color:white}.lendario{background:#f1c40f;color:#000}.ultralendario{background:#e67e22;color:white}.secreto{background:#16a085;color:white}.shiny{background:#ff4757;color:white}.perdido{background:#34495e;color:#bdc3c7}.divino{background:#6c5ce7;color:white}.hiper{background:#e74c3c;color:white}</style></head><body><div class="container"><input type="text" id="nome-jogador" placeholder="Digite seu Nickname..." maxlength="15"><button id="btn-sortear">Sortear Papoi</button><div class="box-resultado"><div id="badge-raridade"></div><div id="txt-nome" class="nome-txt">Clique acima para rolar!</div></div><div class="painel-status"><p>📊 Seus Cliques: <span id="cli-atual" class="destaque">0</span></p><p>👑 Seu Mais Raro: <span id="papoi-mais-raro" class="destaque">Nenhum</span></p></div><div class="ranking-global">🏆 <b>RANKING GLOBAL (TOP 5)</b><ul id="lista-ranking" class="ranking-lista"><li style="text-align:center;color:#888">Carregando ranking...</li></ul></div></div><script>const firebaseConfig={databaseURL:"https://firebaseio.com"};firebase.initializeApp(firebaseConfig);const database=firebase.database();const pesoRaridade={"comum":1,"incomum":2,"raro":3,"epico":4,"mitico":5,"lendario":6,"ultralendario":7,"secreto":8,"shiny":9,"perdido":10,"divino":11,"hiper":12};const papois=[{nome:"Papoi Estudante",peso:98000,classe:"comum"},{nome:"Papoi.",peso:99900,classe:"comum"},{nome:"Papoi colador",peso:95000,classe:"comum"},{nome:"Papoi Hidratado",peso:61000,classe:"incomum"},{nome:"Papoi Roxo",peso:81000,classe:"incomum"},{nome:"Papoi Futampeiro",peso:84000,classe:"incomum"},{nome:"Pôpôi",peso:79000,classe:"incomum"},{nome:"Papoi faxineiro",peso:73000,classe:"incomum"},{nome:"Papoi rapper",peso:67000,classe:"incomum"},{nome:"Papoi Gorilla",peso:63000,classe:"raro"},{nome:"Papoi Pensador",peso:58000,classe:"raro"},{nome:"Papoia",peso:52000,classe:"raro"},{nome:"Papoi Queimado",peso:55000,classe:"raro"},{nome:"Papoi agua de coco",peso:53000,classe:"raro"},{nome:"Papoi Soneca",peso:43000,classe:"epico"},{nome:"Papoi fofinho",peso:40000,classe:"epico"},{nome:"Papoi Empresario",peso:32000,classe:"epico"},{nome:"Papoi de pelúcia",peso:35000,classe:"epico"},{nome:"Papoi mendigo",peso:37000,classe:"epico"},{nome:"Papoi Policial",peso:20000,classe:"mitico"},{nome:"Papoi cansado",peso:17000,classe:"mitico"},{nome:"PapoiMar",peso:14000,classe:"mitico"},{nome:"Papoi nerd",peso:12000,classe:"mitico"},{nome:"Papoi triste",peso:15000,classe:"mitico"},{nome:"Papoi chaveiro",peso:13000,classe:"mitico"},{nome:"Papoi Padre",peso:9000,classe:"lendario"},{nome:"Papoi Soldado",peso:7000,classe:"lendario"},{nome:"Papoi abacate",peso:6500,classe:"lendario"},{nome:"Papoi assustado",peso:8000,classe:"lendario"},{nome:"Papoi gêmeos",peso:5000,classe:"lendario"},{nome:"Papoi caneca",peso:6000,classe:"lendario"},{nome:"Papoi's da Esquina",peso:4500,classe:"ultralendario"},{nome:"Papoi?....",peso:4000,classe:"ultralendario"},{nome:"Papoi Reality show",peso:3000,classe:"ultralendario"},{nome:"Gangue de papois",peso:2500,classe:"ultralendario"},{nome:"Papoi invisível",peso:1700,classe:"ultralendario"},{nome:"Los Papoi's",peso:1000,classe:"secreto"},{nome:"Papoi combinasión",peso:950,classe:"secreto"},{nome:"The last papoi",peso:600,classe:"secreto"},{nome:"Papoi Soneca Shiny",peso:100,classe:"shiny"},{nome:"Papoi Caneca Shiny",peso:86,classe:"shiny"},{nome:"Absolute papoi shiny",peso:250,classe:"shiny"},{nome:"Papoi emo shiny",peso:20,classe:"shiny"},{nome:"Papoigaleria",peso:32,classe:"perdido"},{nome:"Papoikea",peso:49,classe:"perdido"},{nome:"Papoirooms",peso:37,classe:"perdido"},{nome:"Papoicardo",peso:1,classe:"perdido"},{nome:"MEU DEUS UM PAPOI COM LEITE NINHO!",peso:1,classe:"divino"},{nome:"INCRÍVEL, INCRÍVEL, INCRÍVEL UM PAPOI LADRÃO DE MARMITA!!!",peso:1,classe:"divino"},{nome:"PAPIR BR Shiny Diamante ARCO-ÍRIS",peso:1,classe: "hiper"}];const btn=document.getElementById('btn-sortear');const txtNome=document.getElementById('txt-nome');const badgeRaridade=document.getElementById('badge-raridade');const inputNome=document.getElementById('nome-jogador');let jogadorID=localStorage.getItem('papoi_jogador_id')||'player_'+Math.random().toString(36).substr(2,9);localStorage.setItem('papoi_jogador_id',jogadorID);let cliques=parseInt(localStorage.getItem('papoi_cliques'))||0;let maiorRaridadeNivel=parseInt(localStorage.getItem('papoi_nivel'))||0;let maiorRaridadeNome=localStorage.getItem('papoi_nome')||"Nenhum";inputNome.value=localStorage.getItem('papoi_nickname')||"Jogador "+jogadorID.substr(7,3);document.getElementById('cli-atual').innerText=cliques;document.getElementById('papoi-mais-raro').innerText=maiorRaridadeNome;function extrairJogadores(obj){let extraidos=[];if(!obj)return extraidos;if(obj.nome&&obj.cliques){extraidos.push(obj);return extraidos}Object.keys(obj).forEach(k=>{if(typeof obj[k]==='object'){extraidos=extraidos.concat(extrairJogadores(obj[k]))}});return extraidos}database.ref('ranking').on('value',snapshot=>{const listaHtml=document.getElementById('lista-ranking');listaHtml.innerHTML='';const data=snapshot.val();if(!data){listaHtml.innerHTML='<li style="text-align:center;color:#888">Nenhum recorde ainda!</li>';return}let arr=extrairJogadores(data);let n=new Map();arr.forEach(p=>{if(p.nome&&p.cliques){if(!n.has(p.nome)||p.cliques>n.get(p.nome).cliques){n.set(p.nome,p)}}});let f=Array.from(n.values());f.sort((a,b)=>b.cliques-a.cliques);if(f.length===0){listaHtml.innerHTML='<li style="text-align:center;color:#888">Nenhum recorde ainda!</li>'}f.slice(0,5).forEach((p,i)=>{listaHtml.innerHTML+=`<li class="ranking-item"><span><b>${i+1}°</b> ${p.nome}</span><span>💥 ${p.cliques} | 👑 ${p.raro}</span></li>`})});btn.addEventListener('click',()=>{btn.disabled=!0;badgeRaridade.innerHTML='';txtNome.innerText="Sorteando...";cliques++;document.getElementById('cli-atual').innerText=cliques;localStorage.setItem('papoi_cliques',cliques);setTimeout(()=>{let pT=0;for(let i=0;i<papois.length;i++){pT+=papois[i].peso}let s=Math.random()*pT,e=papois;for(let i=0;i<papois.length;i++){s-=papois[i].peso;if(s<=0){e=papois[i];break}}let tC=e.classe.toUpperCase();badgeRaridade.innerHTML='<span class="badge '+e.classe+'">'+tC+'</span>';txtNome.innerText=e.nome;let nA=pesoRaridade[e.classe]||0;if(nA>maiorRaridadeNivel){maiorRaridadeNivel=nA;maiorRaridadeNome=e.nome+" ("+tC+")";document.getElementById('papoi-mais-raro').innerText=maiorRaridadeNome;localStorage.setItem('papoi_nivel',maiorRaridadeNivel);localStorage.setItem('papoi_nome',maiorRaridadeNome)}let nK=inputNome.value.trim()||"Anônimo";localStorage.setItem('papoi_nickname',nK);database.ref('ranking').push({nome:nK,cliques:cliques,raro:maiorRaridadeNome}).then(()=>{btn.disabled=!1}).catch(()=>{btn.disabled=!1})},500)});</script></body></html>
